device: 0
epochs: 100
early_stop_steps: 15

trainer:
  max_grad_norm: 1
  reg_weight_decay: 0.001
  reg_norm: 1
data:
  batch-size: 256
  dataset: duolingguo/all_data  # duolingguo/en_to_de ; duolingguo/en_to_es  ; duolingguo/all_data
loss:
  name: MaskedMAELoss

optimizer:
  name: Adam
  Adam:
    lr: 0.005
    weight_decay: 0.00001
    amsgrad: true
  RMSprop:
    lr: 0.001
    weight_decay: 0.0001

optimizer_sr:
  name: Adam
  Adam:
    lr: 0.005
    weight_decay: 0.0001
    amsgrad: true
  RMSprop:
    lr: 0.0001
    weight_decay: 0.0001


scheduler:
  name: CosineAnnealingLR
  ReduceLROnPlateau:
    factor: 0.2
    patience: 5
    threshold: 0.003
    min_lr: 0.00001
  StepLR:
    step_size: 10
    gamma: 0.1
  MultiStepLR:
    milestones: [2, 10, 20, 50]
    gamma: 0.3
  CosineAnnealingLR:
    T_max: 5
    eta_min: 0.0000001

model:
  DKT:
    n_question: 12326
    p_num: 20962
    embed_l : 100
    embed_p : 64
    input_dim: 11
    hidden_dim: 256
    layer_num: 1
    output_dim: 1
  DNN:
    hidden_dim: 256


